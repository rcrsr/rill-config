# See REPO-STANDARDS.md STD-SUP-1. Derived from rill's copy; this
# repository is a single package, so `directories` names the root only.
version: 2

updates:
  # Package dependencies. One directory, because there is no packages/ tree.
  - package-ecosystem: npm
    directories:
      - '/'
    schedule:
      interval: weekly
      day: monday
    # 0 disables version-update PRs: upgrades are done by hand, in batches,
    # under the repository's upgrade policy. Security updates are a separate
    # host feature (Settings, Code security) and keep flowing. STD-SUP-8. The
    # groups/ignore rules below take effect only if this is raised again.
    open-pull-requests-limit: 0
    labels:
      - 'area:dx'
    groups:
      # One PR per tool family. Ungrouped, the shared toolchain produces a
      # separate PR per bump, which guarantees the updates get ignored.
      oxc:
        patterns:
          - 'oxlint'
          - 'oxfmt'
      typescript:
        patterns:
          - 'typescript'
          - '@types/*'
      testing:
        patterns:
          - 'vitest'
          - '@vitest/*'
      dev-tooling:
        patterns:
          - 'knip'
          - 'lefthook'
    ignore:
      # @rcrsr/rill is a peer pinned in lockstep to the matching rill minor, so
      # its range moves with a deliberate release here, not with a bump PR.
      # The daily compatibility workflow is what catches a breaking rill
      # release, and it tests the range this package actually declares.
      - dependency-name: '@rcrsr/rill'

  # Action versions. Separate ecosystem, so it needs its own entry.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    # See the npm block: 0 disables version-update PRs; security updates persist.
    open-pull-requests-limit: 0
    labels:
      - 'area:dx'
    groups:
      actions:
        patterns:
          - '*'
