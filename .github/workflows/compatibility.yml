name: Compatibility Check

# Builds and tests against the newest published version of each @rcrsr package
# this repository consumes, so a release that breaks this consumer surfaces here
# rather than in a user's install. See REPO-STANDARDS.md STD-CI-9.
#
# Two packages, and they fail in different places, which is why the job runs
# more than build and test:
#
# - @rcrsr/rill is the peer. A break shows up in the build or the suite.
# - @rcrsr/rill-dev carries the conformance checker and the lint rules. A break
#   shows up in check:standards, check:lint, or test:rules and touches no
#   TypeScript at all, so a build-and-test-only job would report green while
#   `pnpm check` was already failing for everyone on main.
on:
  schedule:
    - cron: '0 6 * * *' # Daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

# Scheduled and manual only, so there is no superseded-run problem to solve;
# the group still names the workflow so a manual dispatch does not stack on top
# of the nightly run. See STD-CI-6.
concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compat:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '25'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update @rcrsr packages to latest compatible
        run: pnpm update @rcrsr/rill @rcrsr/rill-dev

      - name: Build
        run: pnpm run build

      - name: Run tests
        run: pnpm run test

      # The three checks that exercise @rcrsr/rill-dev. Run explicitly rather
      # than via `pnpm run check`, which would also re-run the build and the
      # suite above and add format and typecheck legs that neither package can
      # affect.
      - name: Run the lint rules' own tests
        run: pnpm run test:rules

      - name: Lint
        run: pnpm run check:lint

      - name: Check standards
        run: pnpm run check:standards
