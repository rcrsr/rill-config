name: CodeQL

# See REPO-STANDARDS.md STD-SUP-6.
#
# No path filtering, for the same reason as ci.yml: a skipped run reports no
# status, and this workflow is a candidate required context.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    # Weekly, so a newly published CodeQL query reaches this repo without
    # waiting for the next commit. Monday 07:00 UTC, ahead of the dependabot run.
    - cron: '0 7 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  # Never on main, for the same reason as ci.yml: this workflow is a candidate
  # required context, and a cancelled run on main leaves that context unreported
  # for the commit. See STD-CI-6.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          languages: javascript-typescript
          # security-and-quality over the default security-extended: this
          # package resolves specifiers and dynamically imports host code, where
          # a correctness defect is a loading bug, not just a lint nit.
          queries: security-and-quality

      # No build step. javascript-typescript uses CodeQL's `none` build mode,
      # which extracts from source directly.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          category: '/language:javascript-typescript'
