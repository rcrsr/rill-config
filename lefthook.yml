# Lefthook git hooks
# Docs: https://lefthook.dev/configuration/
#
# Skip with `LEFTHOOK=0 git <command>` or `git <command> --no-verify`.

pre-commit:
  piped: true
  commands:
    # Format first, then lint. The reverse order lets the formatter undo a lint
    # fix, so the commit carries the unfixed form. See REPO-STANDARDS.md
    # STD-HOOK-2.
    oxfmt:
      priority: 1
      glob: '*.{ts,tsx,js,mjs,cjs,json,yaml,yml}'
      run: pnpm exec oxfmt {staged_files}
      stage_fixed: true
    oxlint:
      priority: 2
      glob: '*.{ts,tsx}'
      run: pnpm exec oxlint --config .oxlintrc.json --fix {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    check:types:
      run: pnpm run check:types
    test:
      run: pnpm run test
