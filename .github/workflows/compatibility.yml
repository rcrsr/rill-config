name: Compatibility Check

# Builds and tests against the newest published @rcrsr/rill this package's peer
# range admits, so a rill release that breaks this consumer surfaces here rather
# than in a user's install. See dev/REPO-STANDARDS.md STD-CI-9.
on:
  schedule:
    - cron: '0 6 * * *' # Daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

# Scheduled and manual only, so there is no superseded-run problem to solve;
# the group still names the workflow so a manual dispatch does not stack on top
# of the nightly run. See STD-CI-6.
concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compat:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '25'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update @rcrsr/rill to latest compatible
        run: pnpm update @rcrsr/rill

      - name: Build
        run: pnpm run build

      - name: Run tests
        run: pnpm run test
