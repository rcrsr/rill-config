name: Release

on:
  push:
    tags:
      - 'v*'

# Least privilege at the top; the release job re-grants exactly what it needs.
permissions:
  contents: read

# Serialized on a fixed group and never cancelled. Cancelling a publish leaves
# the registry holding a partial release, which the pre-publish existence check
# then reads as already-done on the retry. See REPO-STANDARDS.md STD-CI-6.
concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # write: creates the GitHub Release. id-token: mints the OIDC token the
      # npm provenance attestation requires. `pnpm publish --provenance` below
      # is what consumes it. STD-REL-3 and STD-REL-4.
      #
      # `pnpm publish --help` does not advertise --provenance, which makes it
      # look unsupported. It is not: pnpm 11 bundles libnpmpublish's
      # provenance.js and the flag reaches ensureProvenanceGeneration. pnpm 10
      # ignores it silently, which is why this repo pins 11.
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '25'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Version consistency, before anything is published. This package has no
      # root-versus-package split to reconcile, so the consistency that matters
      # is the pushed tag against the manifest about to be published: a tag cut
      # from the wrong commit would otherwise publish a version nobody asked
      # for, and the point of no return is the publish itself. STD-REL-2.
      - name: Verify tag matches the manifest version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches package.json version $VERSION"

      - name: Build
        run: pnpm run build

      - name: Run tests
        run: pnpm run test

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Without pipefail the `pnpm publish | tee` below reports tee's exit
          # status, so a failed publish would read as success and the job would
          # go on to cut a GitHub Release for a package that never shipped.
          # See REPO-STANDARDS.md STD-REL-6.
          set -o pipefail
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "${NAME}@${VERSION}" version &>/dev/null; then
            echo "Skipping $NAME@$VERSION (already published)"
          else
            echo "Publishing $NAME@$VERSION..."
            # The npm view check above races a concurrent publish: it can pass
            # while another run is mid-publish of the same version. Treat the
            # registry's own conflict response as already-published rather than
            # failing the job. STD-REL-5.
            #
            # Matched on the specific conflict strings, never on a bare E403.
            # npm returns E403 for a revoked token, a token missing publish
            # scope, an org policy change, and lost package ownership as well as
            # for a version conflict, so treating it as "already published"
            # turns every one of those into a silently green release.
            PUBLISH_LOG=$(mktemp)
            if pnpm publish --provenance --access public --no-git-checks 2>&1 | tee "$PUBLISH_LOG"; then
              echo "Published $NAME@$VERSION"
            elif grep -Eqi '(EPUBLISHCONFLICT|cannot publish over( the)? previously published versions|cannot modify pre-existing version)' "$PUBLISH_LOG"; then
              echo "Skipping $NAME@$VERSION (already published, confirmed by registry)"
            else
              echo "Failed to publish $NAME@$VERSION"
              cat "$PUBLISH_LOG"
              rm -f "$PUBLISH_LOG"
              exit 1
            fi
            rm -f "$PUBLISH_LOG"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "GitHub Release '${{ github.ref_name }}' already exists. Skipping creation."
            exit 0
          fi
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
