name: Compatibility Check

# Builds and tests against the newest published version of each @rcrsr package
# the ranges in `package.json` admit, so a release that breaks this consumer
# surfaces here rather than in a user's install. `pnpm update` stays inside
# those ranges: a new minor is covered once the range widens to admit it, not
# on the day it publishes. See REPO-STANDARDS.md STD-CI-9.
#
# Two packages, and they fail in different places, which is why the job runs
# more than build and test:
#
# - @rcrsr/rill is the peer. A break shows up in the build, the typecheck, or
#   the suite. The typecheck is not redundant with the build: tsconfig.json
#   includes src/**/* only, and vitest.config.ts declares no typecheck block,
#   so check:types is the only leg that checks tests/, which import rill's
#   types directly, against the resolved rill.
# - @rcrsr/rill-dev carries the conformance checker and the lint rules. A break
#   shows up in check:standards, check:lint, or test:rules and touches no
#   TypeScript at all, so a build-and-test-only job would report green on a
#   release that already breaks `pnpm check` for anyone who installs it: a
#   contributor's plain `pnpm install`, and the bump PR once dependabot opens
#   it. CI on main stays green through all of it, because it installs the
#   committed lockfile with --frozen-lockfile.
on:
  schedule:
    - cron: '0 6 * * *' # Daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

# Scheduled and manual only, so there is no superseded-run problem to solve;
# the group still names the workflow so a manual dispatch does not stack on top
# of the nightly run. See STD-CI-6.
concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compat:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '25'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update @rcrsr packages to latest compatible
        run: pnpm update @rcrsr/rill @rcrsr/rill-dev

      - name: Build
        run: pnpm run build

      - name: Typecheck
        run: pnpm run check:types

      - name: Run tests
        run: pnpm run test

      # The three checks that exercise @rcrsr/rill-dev. Run explicitly rather
      # than via `pnpm run check`, which would re-run the build, the typecheck
      # and the suite above and add two legs that decide nothing here: format,
      # which reads this tree alone and no @rcrsr release can move, and
      # check:deps, whose only ways to react to an upstream change (a dropped
      # export, bin, or type) fail one of the legs above it first.
      - name: Run the lint rules' own tests
        run: pnpm run test:rules

      - name: Lint
        run: pnpm run check:lint

      - name: Check standards
        run: pnpm run check:standards
